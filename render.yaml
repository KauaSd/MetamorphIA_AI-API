services:
  - type: web
    name: metamorphia-ia-api
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: SECRET_KEY
        sync: false
      - key: DB_API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_ALLOWED_EMAILS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ASSETS_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: metamorphia-arquivos
      - key: RATE_LIMIT_DEFAULT
        value: 120/minute
      - key: ENABLE_MOCK_ROUTES
        value: "false"
